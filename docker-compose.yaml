services:
  api_gateway:
    build: 
      context: ./api_gateway
    ports:
      - "8080:8080"
    volumes:
      - ./shared_data:/app/uploads
    environment:
      Storage__RootPath: /app/uploads
      RabbitMq__HostName: rabbitmq
      RabbitMq__QueueName: resume_analysis
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy 
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  ai_worker:
    build: 
      context: ./ai_worker
    volumes:
      - ./shared_data:/app/uploads
    environment:
      STORAGE_ROOT: /app/uploads
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_QUEUE: resume_analysis
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq_data: